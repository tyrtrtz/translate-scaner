name: Build Windows exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest -v

      - name: Build standalone exe
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name HeaderChecker app.py

      - name: Verify packaged window starts
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "$PWD/dist/HeaderChecker.exe" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Seconds 1
              $window = Get-Process -Name HeaderChecker -ErrorAction SilentlyContinue |
                Where-Object { $_.MainWindowTitle -eq '中韩表头检查' }
              if ($window) { $ready = $true; break }
              $app.Refresh()
              if ($app.HasExited) { throw "Packaged app exited: $($app.ExitCode)" }
            }
            if (-not $ready) { throw 'Packaged application window did not appear.' }
          } finally {
            $app.Refresh()
            if (-not $app.HasExited) { taskkill /PID $app.Id /T /F | Out-Null }
          }

      - name: Upload Windows exe
        uses: actions/upload-artifact@v7
        with:
          name: HeaderChecker-Windows-x64
          path: dist/HeaderChecker.exe
          if-no-files-found: error
          retention-days: 30
