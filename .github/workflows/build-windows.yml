name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest -v

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os; from updater import VERSION; assert os.environ['GITHUB_REF_NAME'] == 'v' + VERSION, 'Tag must match updater.VERSION'"

      - name: Build standalone exe
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name HeaderChecker app.py

      - name: Verify packaged window starts
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "$PWD/dist/HeaderChecker.exe" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Seconds 1
              $window = Get-Process -Name HeaderChecker -ErrorAction SilentlyContinue |
                Where-Object { $_.MainWindowTitle -eq '中韩表头检查' }
              if ($window) { $ready = $true; break }
              $app.Refresh()
              if ($app.HasExited) { throw "Packaged app exited: $($app.ExitCode)" }
            }
            if (-not $ready) { throw 'Packaged application window did not appear.' }
            $oldWindowIds = @($window | ForEach-Object { $_.Id })
            $staging = Join-Path "$PWD/dist" "update-smoke"
            New-Item -ItemType Directory -Path $staging | Out-Null
            Copy-Item "$PWD/dist/HeaderChecker.exe" "$staging/HeaderChecker.exe"
            python -c "import sys; from updater import start_installation; start_installation(sys.argv[1], sys.argv[2], int(sys.argv[3]))" "$staging/HeaderChecker.exe" "$PWD/dist/HeaderChecker.exe" $app.Id
            if ($LASTEXITCODE -ne 0) { throw 'Could not start update helper.' }
            $window | ForEach-Object { $_.CloseMainWindow() | Out-Null }
            $restarted = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $newWindow = Get-Process -Name HeaderChecker -ErrorAction SilentlyContinue |
                Where-Object { $_.MainWindowTitle -eq '中韩表头检查' -and $_.Id -notin $oldWindowIds }
              if ($newWindow -and -not (Test-Path $staging)) { $restarted = $true; break }
            }
            if (-not $restarted) { throw 'Packaged application did not restart after replacement.' }
          } finally {
            Get-Process -Name HeaderChecker -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Upload Windows exe
        uses: actions/upload-artifact@v7
        with:
          name: HeaderChecker-Windows-x64
          path: dist/HeaderChecker.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish client update
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import json, hashlib; from pathlib import Path; from updater import VERSION, REPOSITORY, ASSET_NAME; p = Path('dist') / ASSET_NAME; data = dict(version=VERSION, url=f'https://github.com/{REPOSITORY}/releases/download/v{VERSION}/{ASSET_NAME}', size=p.stat().st_size, sha256=hashlib.sha256(p.read_bytes()).hexdigest()); Path('dist/update.json').write_text(json.dumps(data), encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate update manifest.' }
          gh release create "$env:GITHUB_REF_NAME" "dist/HeaderChecker.exe" "dist/update.json" --verify-tag --title "中韩译文工作台 $env:GITHUB_REF_NAME" --notes-file docs/发布说明.md
